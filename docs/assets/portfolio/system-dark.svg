<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="567" viewBox="0 0 1200 567" role="img" aria-labelledby="title desc"><title id="title">RAG Document QA system diagram</title><desc id="desc">Implementation-oriented diagram; arrows identify information flow. See adjacent README text for accessible explanation and limitations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#a5b8bf"/></marker></defs><rect width="1200" height="567" rx="12" fill="#101b22"/><text x="35" y="42" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e9c278" font-weight="700">04 / RETRIEVAL + EVALUATION / SYSTEM MAP</text><text x="35" y="80" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#f2f1e9" font-weight="700">Keep the retrieval evidence beside the generated answer.</text><rect x="35" y="113" width="330" height="118" rx="9" fill="#15252e" stroke="#344b55"/><rect x="35" y="131" width="4" height="82" fill="#e9c278"/><text x="57" y="147" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Long Korean context</text><text x="57" y="178" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Split by article / 400 characters</text><text x="57" y="202" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >80-character chunk overlap</text><rect x="435" y="113" width="330" height="118" rx="9" fill="#15252e" stroke="#344b55"/><rect x="435" y="131" width="4" height="82" fill="#e9c278"/><text x="457" y="147" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">E5 embeddings + Chroma</text><text x="457" y="178" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Multilingual-e5-small</text><text x="457" y="202" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Temporary store per question</text><rect x="835" y="113" width="330" height="118" rx="9" fill="#15252e" stroke="#344b55"/><rect x="835" y="131" width="4" height="82" fill="#e9c278"/><text x="857" y="147" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Retrieve + expand</text><text x="857" y="178" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Top 3 chunks</text><text x="857" y="202" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Adjacent global chunk indices</text><path d="M370 172H428" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><path d="M770 172H828" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><rect x="35" y="335" width="330" height="126" rx="9" fill="#15252e" stroke="#344b55"/><rect x="35" y="353" width="4" height="90" fill="#e9c278"/><text x="57" y="369" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Generate answer</text><text x="57" y="400" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >gpt-4.1-mini</text><text x="57" y="424" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Retrieved passages in prompt</text><text x="57" y="448" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >NOT_FOUND fallback instruction</text><rect x="435" y="335" width="330" height="126" rx="9" fill="#15252e" stroke="#344b55"/><rect x="435" y="353" width="4" height="90" fill="#e9c278"/><text x="457" y="369" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Two evaluation signals</text><text x="457" y="400" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Embedding similarity</text><text x="457" y="424" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Separate LLM factual grade</text><text x="457" y="448" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Same model family as answerer</text><rect x="835" y="335" width="330" height="126" rx="9" fill="#15252e" stroke="#344b55"/><rect x="835" y="353" width="4" height="90" fill="#e9c278"/><text x="857" y="369" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Inspectable record</text><text x="857" y="400" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Answer + reference + grade</text><text x="857" y="424" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Grader reason + retrieved text</text><text x="857" y="448" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Saved in test_results.csv</text><path d="M1000 236V278H200V326" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><path d="M370 398H428" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><path d="M770 398H828" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><text x="35" y="526" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#a5b8bf" >Saved run: 100 questions, 93 LLM-graded correct. This is a recorded experiment, not benchmark accuracy.</text></svg>
